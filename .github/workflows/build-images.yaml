name: Test, Build and Publish Banking Images

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banking-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    env:
      COMPOSE_PROJECT_NAME: banking-ci
      COMPOSE_FILE: techbleat-global-bank-backend/docker-compose.yml
      # Used only by the disposable CI database.
      POSTGRES_PASSWORD: ci_only_banking_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: finance-agent/requirements.txt

      - name: Test finance agent
        working-directory: finance-agent
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Check Python source syntax
        run: |
          python -m compileall -q \
            techbleat-global-bank-backend/user-service/app \
            techbleat-global-bank-backend/activity-service/app \
            finance-agent

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify transaction service
        working-directory: techbleat-global-bank-backend/transaction-service
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Prepare image names and Compose override
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          services = [
              "user-service",
              "transaction-service",
              "activity-service",
              "finance-agent",
              "frontend",
          ]

          prefix = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          tag = os.environ["GITHUB_SHA"]

          override = {
              "services": {
                  service: {"image": f"{prefix}/{service}:{tag}"}
                  for service in services
              }
          }

          path = Path(os.environ["RUNNER_TEMP"]) / "compose-ci.json"
          path.write_text(json.dumps(override))

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(
                  f"COMPOSE_FILE={os.environ['COMPOSE_FILE']}:{path}\n"
              )
              env.write(f"IMAGE_PREFIX={prefix}\n")
          PY

          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: |
          docker compose build --pull \
            user-service \
            transaction-service \
            activity-service \
            finance-agent \
            frontend

      - name: Start disposable integration stack
        run: |
          docker compose up -d postgres redis kafka

          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres \
                pg_isready -U bankuser -d bankingdb \
              && docker compose exec -T redis redis-cli ping \
              && docker compose exec -T kafka \
                kafka-topics --bootstrap-server kafka:29092 --list; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Infrastructure did not become ready"
              exit 1
            fi

            sleep 3
          done

          docker compose up -d --no-build \
            user-service \
            transaction-service \
            activity-service \
            finance-agent \
            frontend

      - name: Smoke-test running application
        run: python scripts/ci/smoke_test.py

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/deploy'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io \
                -u "$GITHUB_ACTOR" \
                --password-stdin

      - name: Push tested images
        if: github.ref == 'refs/heads/deploy'
        run: |
          echo '## Published banking images' >> "$GITHUB_STEP_SUMMARY"

          for service in user-service transaction-service activity-service finance-agent frontend; do
            IMAGE="$IMAGE_PREFIX/$service"

            docker push "$IMAGE:$GITHUB_SHA"
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"

            echo "- \`$IMAGE:$GITHUB_SHA\` (also tagged \`latest\`)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save container diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose ps -a > ci-logs/containers.txt 2>&1 || true
          docker compose logs --no-color > ci-logs/compose.log 2>&1 || true

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-container-logs
          path: ci-logs/
          retention-days: 7

      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
